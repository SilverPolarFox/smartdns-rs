# .github/workflows/build.yml
name: Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate
      prerelease:
        type: boolean
        description: "Identify the release as a prerelease. Defaults to false"
        required: false

  workflow_dispatch:
    inputs:
      features:
        type: string
        required: false
        default: default
        description: Space or comma separated list of features to activate


jobs:
  build:
    name: build ${{ matrix.target }} ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    runs-on: ${{matrix.os}}
    env:
      DIST_DIR: smartdns-${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust_target: ${{ matrix.target }}

      - name: Build
        run: just build --release --no-default-features --features ${{ inputs.features }} --target=${{ matrix.target }}
        env:
          USE_CROSS: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Package
        run: just target=${{ matrix.target }} pack
        shell: bash

      - name: Compute release label
        id: release_label
        uses: ./.github/actions/sanitize-label
        with:
          raw_label: ${{ inputs.version || github.ref_name }}
          fallback_sha: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: smartdns-${{ matrix.target }}-${{ steps.release_label.outputs.value }}
          retention-days: 30
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2.3.2
        if: ${{ startsWith(inputs.version, 'v') }}
        with:
          draft: false
          prerelease: ${{ inputs.prerelease }}
          tag_name: ${{ inputs.version }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.exe
            dist/*sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
